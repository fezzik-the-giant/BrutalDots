# Weston configuration for the BrutalDots greeter.
#
# SDDM's stock greeter compositor puts every window of one client on a single
# output, which is why a multi-monitor login screen needs this at all. See
# AGENTS.md "Multi-monitor". The rest of the file switches off the panel,
# background, animations and on-screen keyboard desktop-shell would bring.
#
# Installed by ./install.sh. @BACKGROUND@ is filled in from the palette.

[core]
shell=desktop-shell.so
# A greeter that refuses to start because it found no input device is a machine
# you cannot log in to. Nothing here needs one to have been detected first.
require-input=false
# Never blank. weston 15.0.1 aborts on waking from DPMS, and SDDM does not
# restart a greeter whose compositor died. See AGENTS.md "Idle blanking".
idle-time=0

[shell]
panel-position=none
background-color=@BACKGROUND@
# There is nothing to lock — the greeter *is* the lock — and a login screen
# that fades in is a login screen you wait for.
locking=false
animation=none
startup-animation=none
close-animation=none
focus-animation=none

[input-method]
# desktop-shell starts an on-screen keyboard of weston's own — kiosk-shell
# never did, so this only became visible when the shell changed. An empty path
# is how you say "no input method"; weston respawns this program if it exits,
# so pointing it at something harmless is not a way to turn it off.
path=
