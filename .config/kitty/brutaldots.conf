# BrutalDots colours for kitty. Include this at the *end* of kitty.conf so it
# wins the theme while leaving your font, padding and keybinds alone.
#
# The one setting here that is not a colour is the one tiling needs: kitty
# otherwise reopens in the state of the last window closed, so closing one
# while maximized makes every new kitty open maximized over the workspace.
remember_window_size no

# Two palettes and a one-line pointer between them. Light is the absence of an
# include, not a line naming it: kitty treats a second include of the same file
# as a configuration error. See AGENTS.md "kitty".
include brutaldots-light.conf
include brutaldots-mode.conf
